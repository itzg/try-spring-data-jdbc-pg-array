databaseChangeLog:
  - changeSet:
      id: 1784935212827-1
      author: geoff
      objectQuotingStrategy: QUOTE_ONLY_RESERVED_WORDS
      changes:
        - createTable:
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_notebook
                  name: id
                  type: BIGINT
              - column:
                  name: section
                  type: VARCHAR
              - column:
                  name: colors
                  type: text[]
            tableName: notebook
        - createIndex:
            indexName: idx_notebook_colors
            tableName: notebook
            # noinspection YAMLSchemaValidation
            using: gin
            columns:
              - column:
                  name: colors

